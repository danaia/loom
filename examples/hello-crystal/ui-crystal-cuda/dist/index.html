<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pqo Vulkan Crystal Controls</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header><small>CUDA / VULKAN</small><h1>Crystal controls</h1><p>Live controls for the native 3D window</p></header>
      <label>Growth target <output id="growthOut">0.72</output><input id="growth" type="range" min="0.08" max="1" step="0.01" value="0.72" /></label>
      <label>Anisotropy <output id="anisotropyOut">0.68</output><input id="anisotropy" type="range" min="0" max="1" step="0.01" value="0.68" /></label>
      <label>Temperature <output id="temperatureOut">0.18</output><input id="temperature" type="range" min="0" max="1" step="0.01" value="0.18" /></label>
      <label>Damage <output id="damageOut">0.00</output><input id="damage" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <section class="layers" aria-label="Render layers">
        <span>Render layers</span>
        <div>
          <label><input id="show_field" type="checkbox" checked /> Field</label>
          <label><input id="show_particles" type="checkbox" /> Particles</label>
        </div>
      </section>
      <label>Particle display count <output id="particle_countOut">1,000,000</output><input id="particle_count" type="range" min="10000" max="1000000" step="10000" value="1000000" /></label>
      <section class="telemetry">
        <div><span>Compute</span><strong>CUDA sm_120</strong></div>
        <div><span>Simulation</span><strong>100³ cells</strong></div>
        <div><span>3D renderer</span><strong>Native Vulkan</strong></div>
        <div><span>Control bridge</span><strong id="status">Connecting</strong></div>
      </section>
      <button id="reset">Reset controls</button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
