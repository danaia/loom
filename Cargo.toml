[workspace]
members = [
    "crates/pqo-cli",
    "crates/pqo-core",
    "crates/pqo-metal",
    "crates/pqo-ui-panel",
    "crates/pqo-syntax",
    "crates/pqo-validator",
    "crates/pqo-windowing",
]
resolver = "2"

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
keyring = { version = "3.6.3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zeroize = "1"
