[workspace]
members = [
    "crates/loom-cli",
    "crates/loom-core",
    "crates/loom-cuda",
    "crates/loom-metal",
    "crates/loom-ui-panel",
    "crates/loom-syntax",
    "crates/loom-validator",
    "crates/loom-windowing",
]
resolver = "2"

[workspace.package]
version = "0.1.18"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
keyring = { version = "3.6.3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zeroize = "1"
