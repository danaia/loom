[workspace]
members = [
    "crates/loom-cli",
    "crates/loom-core",
    "crates/loom-metal",
    "crates/loom-ui-panel",
    "crates/loom-syntax",
    "crates/loom-validator",
]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
