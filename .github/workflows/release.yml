name: Release Loom

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-metal:
    name: Package Metal Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom-metal-macos-release
      - name: Test language and validation
        run: >-
          cargo test --locked
          --package loom-core
          --package loom-validator
          --package loom-syntax
          --package loom-cli
      - name: Build portable directory
        run: LOOM_BACKEND=metal ./scripts/package-loom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: loom-metal-darwin-arm64
          path: |
            target/dist/loom-metal-darwin-arm64.tar.gz
            target/dist/loom-metal-darwin-arm64.sha256
          if-no-files-found: error

  package-cuda:
    name: Package CUDA Linux CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom-cuda-linux-release
      - name: Install Linux UI dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libxdo-dev
          patchelf
      - name: Test language and validation
        run: >-
          cargo test --locked
          --package loom-core
          --package loom-validator
          --package loom-syntax
          --package loom-cli
      - name: Build portable directory
        run: LOOM_BACKEND=cuda ./scripts/package-loom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: loom-cuda-linux-x86_64
          path: |
            target/dist/loom-cuda-linux-x86_64.tar.gz
            target/dist/loom-cuda-linux-x86_64.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - package-metal
      - package-cuda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --verify-tag
