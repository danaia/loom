name: Release Pqo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pqo-macos-release
      - name: Test language and validation
        run: >-
          cargo test --locked
          --package pqo-core
          --package pqo-validator
          --package pqo-syntax
          --package pqo-cli
      - name: Build portable directory
        run: ./scripts/package-pqo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pqo-darwin-arm64
          path: |
            target/dist/pqo-darwin-arm64.tar.gz
            target/dist/pqo-darwin-arm64.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --verify-tag
