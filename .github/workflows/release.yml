name: Release Loom

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: loom-darwin-arm64
          - runner: macos-15-intel
            asset: loom-darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test language and validation
        run: >-
          cargo test --locked
          --package loom-core
          --package loom-validator
          --package loom-syntax
          --package loom-cli
      - name: Test native Metal path
        run: cargo test --locked --package loom-metal --test native_loom
      - name: Build portable directory
        run: ./scripts/package-loom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            target/dist/${{ matrix.asset }}.tar.gz
            target/dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
