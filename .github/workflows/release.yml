name: Release Pqo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            asset: pqo-darwin-arm64
          - name: Linux x86_64
            runner: ubuntu-24.04
            asset: pqo-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pqo-macos-release
      - name: Install CUDA build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes nvidia-cuda-toolkit
      - name: Test language and validation
        run: >-
          cargo test --locked
          --package pqo-core
          --package pqo-validator
          --package pqo-syntax
          --package pqo-cli
      - name: Build portable directory
        run: ./scripts/package-pqo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            target/dist/${{ matrix.asset }}.tar.gz
            target/dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --verify-tag
