    <text class="metric" x="30" y="380">39</text><text class="metric-label" x="30" y="402">CELLS</text>
    <text class="metric" x="122" y="380">1</text><text class="metric-label" x="122" y="402">COMPONENT</text>
    <text class="metric" x="254" y="380">30,000</text><text class="metric-label" x="254" y="402">HOMEOSTATIC TICKS</text>
