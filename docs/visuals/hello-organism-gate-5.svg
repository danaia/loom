    <text class="card-kicker" x="30" y="42">01 / DEVELOPMENT + HOMEOSTASIS</text>
    <text class="card-title" x="30" y="78">One organizer constructs a body</text>
    <text class="body" x="30" y="108">No mesh, target coordinates, or central controller.</text>

