    <text class="card-title" x="0" y="37">The same checkpoint and lesion. One local capability changed.</text>

    <g transform="translate(0 66)">
      <rect width="448" height="145" rx="20" fill="#11283a" stroke="#2b6f68"/>
      <circle cx="36" cy="38" r="12" fill="#62efbd"/>
      <text class="card-title" x="62" y="46">Injury ON · Repair ON</text>
      <text class="body" x="24" y="82">Coordinated regeneration returns inside the envelope.</text>
      <text class="metric" x="24" y="120">40 cells · accepted</text>
