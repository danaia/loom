<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pqo Hello Organism — Emergent Systems Proof</title>
  <desc id="desc">An evidence view of one organizer developing into a homeostatic organism, receiving a deterministic lesion, and regenerating through local injury and density rules. It includes causal ablations and measured Gate 5 results.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#08121c"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60f0bd"/>
      <stop offset="1" stop-color="#22b9a2"/>
    </linearGradient>
    <linearGradient id="cellBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78c9ff"/>
      <stop offset="1" stop-color="#397ce5"/>
    </linearGradient>
    <radialGradient id="injury">
      <stop offset="0" stop-color="#ff5d6c" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#ff5d6c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5d6c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <symbol id="cell" viewBox="-10 -10 20 20">
      <circle r="8.2" fill="url(#cellBlue)" stroke="#bce6ff" stroke-width="1.1"/>
      <circle cx="-2.5" cy="-2.8" r="2.2" fill="#d9f4ff" opacity="0.55"/>
    </symbol>
    <symbol id="organizer" viewBox="-11 -11 22 22">
      <circle r="9.2" fill="#ff665e" stroke="#ffd4ca" stroke-width="1.2"/>
      <circle r="3.4" fill="#fff2dd" opacity="0.9"/>
    </symbol>
    <style>
      .eyebrow { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 3px; fill: #65e7c4; }
      .title { font: 750 58px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f4f8ff; }
      .subtitle { font: 400 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a8b9ce; }
      .card-title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f2f7ff; }
      .card-kicker { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; fill: #6fe5c3; }
      .body { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9fb0c4; }
      .metric { font: 700 23px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f3f8ff; }
      .metric-label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7f93aa; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8194aa; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #91a5bc; }
      .panel { fill: #101f32; stroke: #203851; stroke-width: 1.2; }
      .rule { stroke: #29445e; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="1320" cy="20" r="360" fill="#123c50" opacity="0.16"/>
  <circle cx="80" cy="930" r="330" fill="#123d39" opacity="0.14"/>

  <g transform="translate(86 72)">
    <text class="eyebrow" x="0" y="0">PQO / HELLO ORGANISM / GATE 5</text>
    <text class="title" x="0" y="70">Form that constructs, sustains, and repairs itself.</text>
    <text class="subtitle" x="0" y="114">Deterministic Metal execution · local laws · no stored target geometry · measured causal proof</text>
  </g>

