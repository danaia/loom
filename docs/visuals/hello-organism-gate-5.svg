      <circle cx="58" cy="-3" r="52" fill="url(#injury)" opacity="0.35"/>
      <path d="M24 52 C44 28 45 2 72-15 C90-27 95-45 108-60" fill="none" stroke="#67edbd" stroke-width="3" stroke-dasharray="5 5"/>
